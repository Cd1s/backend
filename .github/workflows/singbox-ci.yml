name: Sing-box CI and GHCR

on:
  push:
    branches:
      - singbox
  pull_request:
    branches:
      - singbox
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: singbox-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/cd1s/remnawave-backend

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run build:seed
      - run: npm run validate:seed-core-inbounds
      - run: npm run validate:shadowrocket-anytls
      - run: npm run check

  publish:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve frontend commit
        id: frontend
        run: |
          echo "sha=$(git ls-remote https://github.com/Cd1s/remnawave-frontend.git refs/heads/singbox | cut -f1)" \
            >> "$GITHUB_OUTPUT"

      - name: Resolve build time
        id: build
        run: echo "time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:singbox
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: |
            FRONTEND_REPO=https://github.com/Cd1s/remnawave-frontend.git
            FRONTEND_REF=${{ steps.frontend.outputs.sha }}
            __RW_METADATA_VERSION=2.8.1-singbox
            __RW_METADATA_GIT_BACKEND_COMMIT=${{ github.sha }}
            __RW_METADATA_GIT_FRONTEND_COMMIT=${{ steps.frontend.outputs.sha }}
            __RW_METADATA_GIT_BRANCH=singbox
            __RW_METADATA_BUILD_TIME=${{ steps.build.outputs.time }}
            __RW_METADATA_BUILD_NUMBER=${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
