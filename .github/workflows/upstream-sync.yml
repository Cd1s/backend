name: Sync upstream

on:
  schedule:
    # GitHub's minimum supported schedule interval is five minutes. This is near-real-time,
    # not a guarantee of immediate delivery when GitHub is under load.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  actions: read

# `workflows` is a GitHub App/PAT repository permission, not an Actions `permissions` key.
# WORKFLOW_TOKEN must grant contents:write + workflows:write; package/release access is
# preflighted before any image build.

concurrency:
  group: upstream-sync-backend
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/cd1s/remnawave-backend

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: singbox
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Resolve official latest stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPO: remnawave/backend
          UPSTREAM_SYNC_REPORT_PATH: ${{ runner.temp }}/upstream-sync-report.md
        run: bash .github/scripts/upstream-sync-lib.sh resolve

      - name: Detect and merge upstream release commit
        id: sync
        env:
          UPSTREAM_REF: ${{ steps.release.outputs.commit }}
          UPSTREAM_SYNC_REPORT_PATH: ${{ runner.temp }}/upstream-sync-report.md
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/remnawave/backend.git
          git fetch --no-tags upstream main
          git fetch --no-tags upstream "refs/tags/${{ steps.release.outputs.tag }}:refs/tags/upstream-release-${{ steps.release.outputs.tag }}"
          bash .github/scripts/upstream-sync-lib.sh merge

      - name: Verify fork adaptation
        if: steps.sync.outcome == 'success'
        run: node scripts/validate-upstream-adaptation.cjs

      - name: Verify package version from official release commit
        if: steps.sync.outcome == 'success'
        env:
          UPSTREAM_REF: ${{ steps.release.outputs.commit }}
          PACKAGE_PATHS: package.json
          UPSTREAM_SYNC_REPORT_PATH: ${{ runner.temp }}/upstream-sync-report.md
        run: bash .github/scripts/upstream-sync-lib.sh package

      - uses: actions/setup-node@v4
        if: steps.sync.outcome == 'success'
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund
        if: steps.sync.outcome == 'success'

      - name: Install official sing-box 1.13.15 validator
        if: steps.sync.outcome == 'success'
        env:
          SINGBOX_SHA256: a3a3ff223b23c3f4731d0a17cb0ef94c97ce257c70721a5b07dc7ca079203c9f
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/sing-box-1.13.15.tar.gz"
          extract_dir="$RUNNER_TEMP/sing-box-1.13.15"
          url="https://github.com/SagerNet/sing-box/releases/download/v1.13.15/sing-box-1.13.15-linux-amd64.tar.gz"
          curl -fsSL "$url" -o "$archive"
          echo "$SINGBOX_SHA256  $archive" | sha256sum --check
          mkdir -p "$extract_dir"
          tar -xzf "$archive" -C "$extract_dir"
          binary="$(find "$extract_dir" -type f -name sing-box -perm -u+x -print -quit)"
          test -n "$binary"
          echo "SINGBOX_BIN=$binary" >> "$GITHUB_ENV"
          "$binary" version

      - name: Install official Mihomo validator
        if: steps.sync.outcome == 'success'
        env:
          MIHOMO_VERSION: v1.19.29
          MIHOMO_SHA256: a048ecbe2dc598321f63a6fbeffa93f0c10ca6db818f64b2b83cf19ef194d73f
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/mihomo.gz"
          binary="$RUNNER_TEMP/mihomo"
          url="https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-v1-${MIHOMO_VERSION}.gz"
          curl -fsSL "$url" -o "$archive"
          echo "$MIHOMO_SHA256  $archive" | sha256sum --check
          gzip -dc "$archive" > "$binary"
          chmod +x "$binary"
          echo "MIHOMO_BIN=$binary" >> "$GITHUB_ENV"
          "$binary" -v

      - run: npm run validate:singbox-1.13
        if: steps.sync.outcome == 'success'
      - run: npm run validate:mihomo-anytls
        if: steps.sync.outcome == 'success'
      - run: npm run validate:clash-anytls
        if: steps.sync.outcome == 'success'
      - run: npm run build
        if: steps.sync.outcome == 'success'
      - run: npm run build:seed
        if: steps.sync.outcome == 'success'
      - run: npm run validate:seed-core-inbounds
        if: steps.sync.outcome == 'success'
      - run: npm run validate:shadowrocket-anytls
        if: steps.sync.outcome == 'success'
      - run: npm run check
        if: steps.sync.outcome == 'success'

      - name: Verify write capabilities before any image build
        if: steps.sync.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
          WORKFLOW_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
          PACKAGE_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          UPSTREAM_SYNC_REPORT_PATH: ${{ runner.temp }}/upstream-sync-report.md
        run: |
          set -euo pipefail
          test -n "$WORKFLOW_TOKEN"
          git config --unset-all http.https://github.com/.extraheader || true
          auth_header="$(printf 'x-access-token:%s' "$WORKFLOW_TOKEN" | base64 | tr -d '\n')"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth_header" \
          bash .github/scripts/upstream-sync-lib.sh preflight

      - name: Resolve final fork commit
        id: source
        if: steps.sync.outcome == 'success'
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push tested merge
        if: steps.sync.outcome == 'success'
        env:
          WORKFLOW_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$WORKFLOW_TOKEN"
          git config --unset-all http.https://github.com/.extraheader || true
          auth_header="$(printf 'x-access-token:%s' "$WORKFLOW_TOKEN" | base64 | tr -d '\n')"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth_header" \
          git push origin HEAD:singbox

      - name: Verify pushed final commit
        if: steps.sync.outcome == 'success'
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
        run: |
          remote_sha="$(git ls-remote origin refs/heads/singbox | awk 'NR == 1 { print $1 }')"
          if [ "$remote_sha" != "$EXPECTED_SHA" ]; then
            echo "release_sync=failed reason=remote_branch_not_at_final_commit expected=$EXPECTED_SHA actual=${remote_sha:-missing}" >&2
            exit 1
          fi

      - name: Resolve frontend commit and build metadata
        id: metadata
        if: steps.sync.outcome == 'success'
        run: |
          echo "frontend=$(git ls-remote https://github.com/Cd1s/remnawave-frontend.git refs/heads/singbox | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        if: steps.sync.outcome == 'success'
      - uses: docker/setup-buildx-action@v3
        if: steps.sync.outcome == 'success'
      - uses: docker/login-action@v3
        if: steps.sync.outcome == 'success'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        if: steps.sync.outcome == 'success'
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:singbox
            ${{ env.IMAGE }}:sha-${{ steps.source.outputs.sha }}
          build-args: |
            FRONTEND_REPO=https://github.com/Cd1s/remnawave-frontend.git
            FRONTEND_REF=${{ steps.metadata.outputs.frontend }}
            __RW_METADATA_VERSION=${{ steps.release.outputs.version }}
            __RW_METADATA_GIT_BACKEND_COMMIT=${{ steps.source.outputs.sha }}
            __RW_METADATA_GIT_FRONTEND_COMMIT=${{ steps.metadata.outputs.frontend }}
            __RW_METADATA_GIT_BRANCH=singbox
            __RW_METADATA_BUILD_TIME=${{ steps.metadata.outputs.time }}
            __RW_METADATA_BUILD_NUMBER=${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync official fork Release
        if: steps.sync.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
          FORK_REPO: ${{ github.repository }}
          FORK_COMMIT: ${{ steps.source.outputs.sha }}
          UPSTREAM_REPO: remnawave/backend
          UPSTREAM_RELEASE_TAG: ${{ steps.release.outputs.tag }}
          UPSTREAM_RELEASE_URL: ${{ steps.release.outputs.url }}
          UPSTREAM_RELEASE_VERSION: ${{ steps.release.outputs.version }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/sync-release.sh sync

      - name: Upload auditable upstream failure report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: upstream-sync-report-${{ github.run_id }}
          path: ${{ runner.temp }}/upstream-sync-report.md
          if-no-files-found: warn
