name: Sync upstream

on:
  schedule:
    - cron: '40 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: upstream-sync-backend
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/cd1s/remnawave-backend

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: singbox
          fetch-depth: 0

      - name: Merge upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/remnawave/backend.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date."
            exit 0
          fi
          git merge --no-edit upstream/main

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run check

      - name: Push tested merge
        run: git push origin HEAD:singbox

      - name: Resolve source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve frontend commit
        id: frontend
        run: |
          echo "sha=$(git ls-remote https://github.com/Cd1s/frontend.git refs/heads/singbox | cut -f1)" \
            >> "$GITHUB_OUTPUT"

      - name: Resolve build time
        id: build
        run: echo "time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:singbox
            ${{ env.IMAGE }}:sha-${{ steps.source.outputs.sha }}
          build-args: |
            FRONTEND_REPO=https://github.com/Cd1s/frontend.git
            FRONTEND_REF=${{ steps.frontend.outputs.sha }}
            __RW_METADATA_VERSION=2.8.1-singbox
            __RW_METADATA_GIT_BACKEND_COMMIT=${{ steps.source.outputs.sha }}
            __RW_METADATA_GIT_FRONTEND_COMMIT=${{ steps.frontend.outputs.sha }}
            __RW_METADATA_GIT_BRANCH=singbox
            __RW_METADATA_BUILD_TIME=${{ steps.build.outputs.time }}
            __RW_METADATA_BUILD_NUMBER=${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
