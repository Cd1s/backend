name: Sync upstream

on:
  schedule:
    - cron: '40 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

# `workflows` is a GitHub App/PAT repository permission, not a valid Actions
# `permissions` key. WORKFLOW_TOKEN must grant contents:write + workflows:write.

concurrency:
  group: upstream-sync-backend
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/cd1s/remnawave-backend

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: singbox
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Verify workflow-capable push token
        env:
          WORKFLOW_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
        run: |
          if [ -z "$WORKFLOW_TOKEN" ]; then
            echo "upstream_sync=failed reason=missing_WORKFLOW_TOKEN requires contents:write_and_workflows:write" >&2
            exit 1
          fi

      - name: Resolve official latest release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_REPO: remnawave/backend
        run: bash .github/scripts/sync-release.sh resolve

      - name: Detect and merge upstream
        id: sync
        env:
          UPSTREAM_SYNC_REPORT_PATH: ${{ runner.temp }}/upstream-sync-conflict-report.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/remnawave/backend.git
          git fetch upstream main
          node scripts/sync-upstream.cjs --upstream-ref upstream/main

      - name: Upload upstream conflict report
        if: ${{ always() && steps.sync.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: upstream-sync-conflict-report
          path: ${{ runner.temp }}/upstream-sync-conflict-report.md
          if-no-files-found: warn

      - name: Validate fork adaptation
        if: steps.sync.outcome == 'success'
        run: node scripts/validate-upstream-adaptation.cjs

      - uses: actions/setup-node@v4
        if: steps.sync.outcome == 'success'
        with:
          node-version: 24
          cache: npm

      - name: Resolve merged package version
        id: version
        if: steps.sync.outcome == 'success'
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [ "$package_version" != "$EXPECTED_VERSION" ]; then
            echo "release_sync=failed reason=package_version_mismatch expected=$EXPECTED_VERSION actual=$package_version" >&2
            exit 1
          fi
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

      - run: npm ci --no-audit --no-fund
        if: steps.sync.outcome == 'success'
      - name: Install official Mihomo validator
        if: steps.sync.outcome == 'success'
        env:
          MIHOMO_VERSION: v1.19.29
          MIHOMO_SHA256: a048ecbe2dc598321f63a6fbeffa93f0c10ca6db818f64b2b83cf19ef194d73f
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/mihomo.gz"
          binary="$RUNNER_TEMP/mihomo"
          url="https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-v1-${MIHOMO_VERSION}.gz"
          curl -fsSL "$url" -o "$archive"
          echo "$MIHOMO_SHA256  $archive" | sha256sum --check
          gzip -dc "$archive" > "$binary"
          chmod +x "$binary"
          echo "MIHOMO_BIN=$binary" >> "$GITHUB_ENV"
          "$binary" -v
      - run: npm run validate:mihomo-anytls
        if: steps.sync.outcome == 'success'
      - run: npm run build
        if: steps.sync.outcome == 'success'
      - run: npm run build:seed
        if: steps.sync.outcome == 'success'
      - run: npm run validate:seed-core-inbounds
        if: steps.sync.outcome == 'success'
      - run: npm run validate:shadowrocket-anytls
        if: steps.sync.outcome == 'success'
      - run: npm run check
        if: steps.sync.outcome == 'success'

      - name: Resolve source commit
        id: source
        if: steps.sync.outcome == 'success'
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve frontend commit
        id: frontend
        if: steps.sync.outcome == 'success'
        run: |
          echo "sha=$(git ls-remote https://github.com/Cd1s/remnawave-frontend.git refs/heads/singbox | cut -f1)" \
            >> "$GITHUB_OUTPUT"

      - name: Resolve build time
        id: build
        if: steps.sync.outcome == 'success'
        run: echo "time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        if: steps.sync.outcome == 'success'

      - uses: docker/setup-buildx-action@v3
        if: steps.sync.outcome == 'success'

      - uses: docker/login-action@v3
        if: steps.sync.outcome == 'success'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: steps.sync.outcome == 'success'
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:singbox
            ${{ env.IMAGE }}:sha-${{ steps.source.outputs.sha }}
          build-args: |
            FRONTEND_REPO=https://github.com/Cd1s/remnawave-frontend.git
            FRONTEND_REF=${{ steps.frontend.outputs.sha }}
            __RW_METADATA_VERSION=${{ steps.version.outputs.version }}
            __RW_METADATA_GIT_BACKEND_COMMIT=${{ steps.source.outputs.sha }}
            __RW_METADATA_GIT_FRONTEND_COMMIT=${{ steps.frontend.outputs.sha }}
            __RW_METADATA_GIT_BRANCH=singbox
            __RW_METADATA_BUILD_TIME=${{ steps.build.outputs.time }}
            __RW_METADATA_BUILD_NUMBER=${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push tested merge
        if: steps.sync.outcome == 'success'
        run: git push origin HEAD:singbox
      - name: Verify pushed final commit
        if: steps.sync.outcome == 'success'
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
        run: |
          remote_sha="$(git ls-remote origin refs/heads/singbox | awk 'NR == 1 { print $1 }')"
          if [ "$remote_sha" != "$EXPECTED_SHA" ]; then
            echo "release_sync=failed reason=remote_branch_not_at_final_commit expected=$EXPECTED_SHA actual=${remote_sha:-missing}" >&2
            exit 1
          fi

      - name: Sync official fork Release
        if: steps.sync.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORK_REPO: ${{ github.repository }}
          FORK_COMMIT: ${{ steps.source.outputs.sha }}
          UPSTREAM_REPO: remnawave/backend
          UPSTREAM_RELEASE_TAG: ${{ steps.release.outputs.tag }}
          UPSTREAM_RELEASE_URL: ${{ steps.release.outputs.url }}
          UPSTREAM_RELEASE_VERSION: ${{ steps.release.outputs.version }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/sync-release.sh sync
